<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>随机图片展示</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #f5f5f5;
        }
        img {
            max-width: 90%;
            max-height: 90%;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>
    <img id="randomImage" src="" alt="随机图片">

    <script>
        // 配置图片数量（根据你实际放了多少张图来设置）
        const imageCount = 10; // 假设你有10张图：1.jpg ~ 10.jpg
        const randomNumber = Math.floor(Math.random() * imageCount) + 1;
        const imagePath = `images/ending_${randomNumber}.jpg`;

        // 设置图片路径
        document.getElementById('randomImage').src = imagePath;
    </script>
</body>
</html>
